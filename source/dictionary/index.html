<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Lee's Security Dictionary</title>
  <link rel="stylesheet" href="./dictionary.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main id="unlock-view" class="unlock-shell">
    <section class="unlock-card" aria-labelledby="unlock-title">
      <div class="unlock-brand">
        <a class="back-link" href="/">← Lee's SecLab</a>
        <div class="brand-copy">
          <span class="brand-mark">LS</span>
          <p class="brand-kicker">LEE'S SECLAB</p>
          <h1 id="unlock-title">Security<br>Dictionary</h1>
          <p class="topic-line">WEB · PWN · CRYPTO · REVERSE · LINUX</p>
        </div>
      </div>
      <div class="unlock-panel">
        <h2>访问字典</h2>
        <form id="unlock-form">
          <label for="password">访问密码</label>
          <div class="password-row">
            <input id="password" name="password" type="password" minlength="16" autocomplete="current-password" required autofocus>
            <button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.75"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.75"/><path d="M4 4 20 20"/></svg>
            </button>
          </div>
          <button id="unlock-button" class="primary-button" type="submit">解锁</button>
        </form>
        <p id="unlock-status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div id="app-view" class="app-shell" hidden>
    <header class="app-header">
      <a class="brand" href="#/">Lee's <span>Dictionary</span></a>
      <div class="header-actions">
        <button id="open-search" class="search-button" type="button" aria-label="搜索知识库"><span>搜索</span><kbd>Ctrl K</kbd></button>
        <button id="lock-button" class="text-button" type="button">锁定</button>
        <a class="text-button" href="/">博客</a>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="知识库分类">
        <div class="sidebar-heading">
          <strong>知识字典</strong>
          <span id="document-count"></span>
        </div>
        <div class="feature-nav" aria-label="探索工具">
          <button id="snippet-library" class="feature-link" type="button"><span>代码片段</span><span id="snippet-count">—</span></button>
          <button id="file-library" class="feature-link" type="button"><span>全部文件</span><span id="file-count">—</span></button>
          <button id="random-document" class="feature-link" type="button"><span>随机漫游</span><span>↗</span></button>
        </div>
        <nav id="category-nav"></nav>
      </aside>

      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="search-dialog" class="search-dialog">
    <div class="search-box">
      <div class="search-heading">
        <label for="search-input">搜索知识库</label>
        <button id="close-search" type="button" aria-label="关闭搜索">×</button>
      </div>
      <input id="search-input" type="search" placeholder="搜索…" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </dialog>

  <noscript>此加密知识库需要启用 JavaScript 才能在浏览器中解锁。</noscript>
  <script src="./dictionary.js" defer></script>
</body>
</html>
